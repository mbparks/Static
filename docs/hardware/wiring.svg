<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" role="img" font-family="ui-monospace,Menlo,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>STATIC hardware connection diagram and Shard token cutaway</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a93a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>.b{fill:#12151d;stroke-width:.5}.th{fill:#e8e4d8;font-size:14px}.ts{fill:#8a93a8;font-size:12px}</style>
<rect x="40" y="40" width="180" height="56" rx="8" fill="#0f3d33" stroke="#1D9E75"/>
<text class="th" x="130" y="65" text-anchor="middle">GM laptop</text><text class="ts" x="130" y="82" text-anchor="middle">console + table view</text>
<rect x="440" y="40" width="200" height="56" rx="8" fill="#2b2560" stroke="#7F77DD"/>
<text class="th" x="540" y="65" text-anchor="middle">External display</text><text class="ts" x="540" y="82" text-anchor="middle">projector or TV</text>
<line x1="220" y1="68" x2="438" y2="68" stroke="#8a93a8" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="329" y="60" text-anchor="middle">HDMI</text>
<rect x="55" y="150" width="150" height="56" rx="8" fill="#4a1f10" stroke="#D85A30"/>
<text class="th" x="130" y="175" text-anchor="middle">Dock ESP32</text><text class="ts" x="130" y="192" text-anchor="middle">radio bridge</text>
<line x1="130" y1="96" x2="130" y2="148" stroke="#8a93a8" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text class="ts" x="162" y="126" text-anchor="middle">USB</text>
<line x1="205" y1="178" x2="300" y2="250" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="205" y1="178" x2="440" y2="250" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="205" y1="178" x2="580" y2="250" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="ts" x="470" y="204" fill="#AFA9EC">Bluetooth (wireless)</text>
<rect x="250" y="252" width="110" height="50" rx="8" fill="#4b1528" stroke="#D4537E"/><text class="th" x="305" y="274" text-anchor="middle">Shard 1</text><text class="ts" x="305" y="291" text-anchor="middle">player token</text>
<rect x="390" y="252" width="110" height="50" rx="8" fill="#4b1528" stroke="#D4537E"/><text class="th" x="445" y="274" text-anchor="middle">Shard 2</text><text class="ts" x="445" y="291" text-anchor="middle">player token</text>
<rect x="530" y="252" width="110" height="50" rx="8" fill="#4b1528" stroke="#D4537E"/><text class="th" x="585" y="274" text-anchor="middle">Shard 3</text><text class="ts" x="585" y="291" text-anchor="middle">player token</text>
<line x1="40" y1="340" x2="640" y2="340" stroke="#888780" stroke-width=".5" stroke-dasharray="3 4"/>
<text class="th" x="40" y="366">Inside a player token (cutaway)</text>
<path d="M210 560 L210 470 Q210 452 235 448 L445 448 Q470 452 470 470 L470 560 Z" fill="#31353c" stroke="#5F5E5A"/>
<text class="ts" x="340" y="551" text-anchor="middle">3D-printed base</text>
<circle cx="340" cy="410" r="16" fill="#5a616e" stroke="#454b57"/><rect x="332" y="424" width="16" height="26" rx="4" fill="#5a616e" stroke="#454b57"/>
<ellipse cx="340" cy="462" rx="128" ry="20" fill="none" stroke="#1D9E75" stroke-width="2"/>
<g fill="#5DCAA5"><circle cx="220" cy="462" r="3.5"/><circle cx="255" cy="470" r="3.5"/><circle cx="300" cy="475" r="3.5"/><circle cx="340" cy="476" r="3.5"/><circle cx="380" cy="475" r="3.5"/><circle cx="425" cy="470" r="3.5"/><circle cx="460" cy="462" r="3.5"/></g>
<rect x="300" y="495" width="80" height="26" rx="4" fill="#5c2a18" stroke="#993C1D"/><text class="ts" x="340" y="511" text-anchor="middle">Shard ESP32</text>
<rect x="300" y="525" width="80" height="18" rx="3" fill="#6f4d11" stroke="#854F0B"/><text class="ts" x="340" y="537" text-anchor="middle">LiPo battery</text>
<circle cx="250" cy="510" r="7" fill="none" stroke="#7F77DD" stroke-width="1.5"/>
<line class="leader" x1="460" y1="462" x2="560" y2="440" stroke="#73726c" stroke-width=".5" stroke-dasharray="3 3"/><text class="ts" x="564" y="444">LED ring (rim)</text>
<line x1="380" y1="508" x2="560" y2="500" stroke="#73726c" stroke-width=".5" stroke-dasharray="3 3"/><text class="ts" x="564" y="504">ESP32 + Bluetooth</text>
<line x1="380" y1="534" x2="560" y2="530" stroke="#73726c" stroke-width=".5" stroke-dasharray="3 3"/><text class="ts" x="564" y="534">rechargeable battery</text>
<line x1="243" y1="510" x2="150" y2="510" stroke="#73726c" stroke-width=".5" stroke-dasharray="3 3"/><text class="ts" x="146" y="514" text-anchor="end">touch pad</text>
</svg>
