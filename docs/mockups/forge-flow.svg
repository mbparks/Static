xt><text x="512" y="84" fill="#8a93a8" font-size="8.6" text-anchor="middle"></text><text x="512" y="110" fill="#e8e4d8" font-size="8.6" text-anchor="middle">THE FIRST TO SPEAK A NAME</text><text x="512" y="136" fill="#e8e4d8" font-size="8.6" text-anchor="middle">SHOULD BE THE ONE</text><text x="512" y="162" fill="#e8e4d8" font-size="8.6" text-anchor="middle">WHO WILL CARRY IT</text><text x="512" y="188" fill="#e8e4d8" font-size="8.6" text-anchor="middle">        V E X ▌</text><text x="615" y="140" fill="#5a6478" font-size="14" text-anchor="middle">→</text><rect x="620" y="24" width="184" height="230" rx="6" fill="#12151d" stroke="#2a3040" stroke-width="1"/><text x="712" y="50" fill="#5DCAA5" font-size="10" text-anchor="middle" letter-spacing="2">IGNITION</text><text x="712" y="84" fill="#8a93a8" font-size="8.6" text-anchor="middle">✓ firmware written</text><text x="712" y="110" fill="#8a93a8" font-size="8.6" text-anchor="middle">✓ soul inscribed</text><text x="712" y="136" fill="#8a93a8" font-size="8.6" text-anchor="middle">✓ keys born on the shard</text><text x="712" y="162" fill="#8a93a8" font-size="8.6" text-anchor="middle">PUT THE SCREEN DOWN.</text><text x="712" y="188" fill="#e8e4d8" font-size="8.6" text-anchor="middle">[ PRINT THE FIRST CARD ]</text><text x="410" y="282" fill="#5a6478" font-size="9.5" text-anchor="middle">connect → build → speak the name (its own bare screen) → ignite in name-derived order → the first card</text></svg>